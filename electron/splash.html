<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline';">
  <title>Qingqiu World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      margin-bottom: 24px;
      object-fit: cover;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    .splash-title {
      color: #1a1a2e;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
    }
    .splash-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: #6b7280;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img class="splash-logo" src="splash-icon.png" alt="Logo" />
  <div class="splash-title">Qingqiu World</div>
  <div class="splash-spinner"></div>
</body>
</html>
