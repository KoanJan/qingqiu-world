appId: com.qingqiu-world.app
productName: Qingqiu World
directories:
  output: dist-electron
files:
  - electron/dist/**/*
  - web-dist/**/*
mac:
  artifactName: "${name}-${version}-mac-${arch}.${ext}"
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: app-icons/icon.icns
  hardenedRuntime: true
  extraResources:
    - from: server/qingqiu-world-server
      to: server/qingqiu-world-server
  extendInfo:
    NSMicrophoneUsageDescription: "Qingqiu World does not use the microphone."
    NSCameraUsageDescription: "Qingqiu World does not use the camera."
win:
  artifactName: "${name}-${version}-win-${arch}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
  icon: app-icons/icon.ico
  extraResources:
    - from: server/qingqiu-world-server.exe
      to: server/qingqiu-world-server.exe
linux:
  artifactName: "${name}-${version}-linux-${arch}.${ext}"
  target:
    - deb
    - rpm
  icon: app-icons/icon-1024.png
  category: Utility
  extraResources:
    - from: server/qingqiu-world-server
      to: server/qingqiu-world-server
